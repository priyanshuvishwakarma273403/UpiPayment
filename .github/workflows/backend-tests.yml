name: SentinelX Backend Tests Runner

on:
  push:
    paths:
      - '**/src/**'
      - '**/pom.xml'
  pull_request:
    paths:
      - '**/src/**'
      - '**/pom.xml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Microservices Unit Tests
        run: |
          ./mvnw test -B
