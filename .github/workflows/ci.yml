name: SentinelX Sentinel Unified CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checkout-and-build:
    name: 1. Checkout & Java Microservices Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Microservices
        run: |
          echo "Building Java Microservices..."
          ./mvnw clean compile -B

  unit-and-integration-tests:
    name: 2. Unit & Integration Tests
    needs: checkout-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          echo "Running Backend Unit & Integration Tests..."
          ./mvnw test -B

  frontend-build:
    name: 3. Frontend Build & Assets Compilation
    needs: unit-and-integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Frontend Assets
        run: |
          echo "Verifying Frontend Dashboard HTML5 Artifacts..."
          ls -la brain/*.html || true

  docker-build:
    name: 4. Multi-Stage Production Docker Build
    needs: [unit-and-integration-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fraud Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: ./Fraud/Fraud
          file: ./Fraud/Fraud/Dockerfile
          push: false
          tags: sentinelx/fraud-service:latest

      - name: Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./MlService
          file: ./MlService/Dockerfile
          push: false
          tags: sentinelx/ml-service:latest

  security-scan:
    name: 5. Security & Secret Scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: 6. Kubernetes Production Deployment
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes Cluster
        run: |
          echo "Deploying SentinelX UPI Mesh manifests to Kubernetes..."
          kubectl apply -f k8s/namespace.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/configmap.yaml --dry-run=client -o yaml
          kubectl apply -f k8s/ingress.yaml --dry-run=client -o yaml
