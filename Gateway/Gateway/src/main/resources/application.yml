server:
  port: 8080


spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false

      # Service Routes - Eureka se dynamically resolve hote hain
      routes:

        # ---- AUTH SERVICE ----
        - id: auth-service
          uri: lb://auth-service  # lb = load balanced via Eureka
          predicates:
            - Path=/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20   # 20 req/sec
                redis-rate-limiter.burstCapacity: 40   # Max burst
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth

        # ---- WALLET SERVICE ----
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/wallet/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
            - name: CircuitBreaker
              args:
                name: walletServiceCB
                fallbackUri: forward:/fallback/wallet
            - AddRequestHeader=X-Gateway-Source, upi-mesh-gateway

        # ---- PAYMENT SERVICE ----
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payment

        # ---- TRANSACTION SERVICE ----
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/transactions/**, /transaction/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100

        # ---- PAYROLL SERVICE ----
        - id: payroll-service
          uri: lb://payroll-service
          predicates:
            - Path=/payroll/**

        # ---- ANALYTICS SERVICE ----
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/analytics/**

        # ---- MERCHANT SERVICE ----
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/merchant/**

        # ---- FRAUD SERVICE ----
        - id: fraud-service
          uri: lb://fraud-service
          predicates:
            - Path=/fraud/**

        # ---- AI SERVICE ----
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # AI calls expensive hain
                redis-rate-limiter.burstCapacity: 10

        # ---- SYNC SERVICE ----
        - id: sync-service
          uri: lb://sync-service
          predicates:
            - Path=/sync/**

        # ---- BANK GATEWAY SERVICE ----
        - id: bank-gateway-service
          uri: lb://bank-gateway-service
          predicates:
            - Path=/bank/**

        # ---- SETTLEMENT SERVICE ----
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/settlement/**

        # ---- RECONCILIATION SERVICE ----
        - id: reconciliation-service
          uri: lb://reconciliation-service
          predicates:
            - Path=/reconciliation/**

        # ---- KYC SERVICE ----
        - id: kyc-service
          uri: lb://kyc-service
          predicates:
            - Path=/kyc/**

        # ---- AML SERVICE ----
        - id: aml-service
          uri: lb://aml-service
          predicates:
            - Path=/aml/**

        # ---- RISK SCORING SERVICE ----
        - id: risk-scoring-service
          uri: lb://risk-scoring-service
          predicates:
            - Path=/risk/**

        # ---- SUBSCRIPTION SERVICE ----
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/subscription/**

        # ---- INVOICE SERVICE ----
        - id: invoice-service
          uri: lb://invoice-service
          predicates:
            - Path=/invoice/**

        # ---- DISPUTE SERVICE ----
        - id: dispute-service
          uri: lb://dispute-service
          predicates:
            - Path=/dispute/**

        # ---- REWARDS SERVICE ----
        - id: rewards-service
          uri: lb://rewards-service
          predicates:
            - Path=/rewards/**

        # ---- LOAN SERVICE ----
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/loan/**

        # ---- REFERRAL SERVICE ----
        - id: referral-service
          uri: lb://referral-service
          predicates:
            - Path=/referral/**

        # ---- NPCI INTEGRATION SERVICE ----
        - id: npci-integration-service
          uri: lb://npci-integration-service
          predicates:
            - Path=/npci/**

        # ---- NOTIFICATION SERVICE ----
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/**

      # Default filters for ALL routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Config (same secret as auth-service)
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyHereMustBe256BitsLongForHS256AlgorithmSecurity}

# Resilience4j Circuit Breaker config
resilience4j:
  circuitbreaker:
    instances:
      authServiceCB:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
      walletServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      authServiceCB:
        timeout-duration: 10s
      walletServiceCB:
        timeout-duration: 10s
      paymentServiceCB:
        timeout-duration: 10s


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.upi.gateway: DEBUG