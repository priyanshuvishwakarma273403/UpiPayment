server:
  port: 8094

spring:
  application:
    name: kyc-service
  datasource:
    url: jdbc:mysql://localhost:3306/kyc_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: KycHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

kyc:
  mock-mode: ${KYC_MOCK_MODE:true}
  uidai:
    api-url: ${UIDAI_API_URL:https://api.uidai.gov.in}
    api-key: ${UIDAI_API_KEY:mock-uidai-key}
    otp-expiry-seconds: 300
    max-attempts: 3
  nsdl:
    api-url: ${NSDL_API_URL:https://api.nsdl.co.in}
    api-key: ${NSDL_API_KEY:mock-nsdl-key}
  face-match:
    api-url: ${FACE_MATCH_API_URL:https://api.hyperverge.co}
    api-key: ${FACE_MATCH_API_KEY:mock-face-key}
    threshold: ${FACE_MATCH_THRESHOLD:80.0}
    provider: ${FACE_MATCH_PROVIDER:MOCK}
  limits:
    level-0: 10000.00
    level-1: 100000.00
    level-2: 999999999.00
  internal-key: ${INTERNAL_SERVICE_KEY:internal-secret-change-in-prod}
  encryption:
    # 32 characters key for AES-256
    key: ${KYC_ENCRYPTION_KEY:MySuperSecretKeyForKycEncryption!!}

resilience4j:
  circuitbreaker:
    instances:
      uidaiService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      nsdlService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      uidaiService:
        maxAttempts: 3
        waitDuration: 2s
      nsdlService:
        maxAttempts: 2
        waitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.upimesh.kyc: DEBUG
    org.springframework.security: INFO
