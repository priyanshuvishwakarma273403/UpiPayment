server:
  port: 8093

spring:
  application:
    name: reconciliation-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/reconciliation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: pop99558$$
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
      port: 6379
      timeout: 3000ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER:http://admin:admin123@localhost:8761/eureka/}}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

reconciliation:
  schedule:
    cron: "0 30 2 * * *"  # 2:30 AM daily
  lookback-days: 3
  report-retention-days: 2555  # 7 years compliance

internal:
  service-key: internal-secret-change-in-prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.upimesh.reconciliation: DEBUG
