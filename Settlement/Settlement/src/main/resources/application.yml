server:
  port: 8092

spring:
  application:
    name: settlement-service

  datasource:
    url: jdbc:mysql://localhost:3306/settlement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: pop99558$$
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

settlement:
  schedule:
    cron: "0 0 1 * * *"  # 1 AM daily
  cycle: T_PLUS_1
  min-amount: 1.00
  neft-threshold: 200000.00
  max-retry: 3

internal:
  service-key: internal-secret-change-in-prod

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.upimesh.settlement: DEBUG
