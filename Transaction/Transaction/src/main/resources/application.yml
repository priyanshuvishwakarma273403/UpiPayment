server:
  port: 8084

spring:
  application:
    name: transaction-service

  # MySQL - Transaction Ledger
  datasource:
    url: jdbc:mysql://localhost:3306/upi_transaction_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TransactionHikariPool
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # MongoDB - Audit + Payment logs
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/upi_transaction_logs}
      database: upi_transaction_logs

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.upi.transaction: DEBUG