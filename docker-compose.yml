    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://admin:admin123@eureka-server:8761/eureka/}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-upimesh}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-upimesh_secret}
    networks:
      - upimesh-network

  analytics:
    build:
      context: ./Analytics/Analytics
    container_name: upimesh-analytics
    ports:
      - "${ANALYTICS_PORT:-8105}:8105"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://admin:admin123@eureka-server:8761/eureka/}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-upimesh}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-upimesh_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - upimesh-network
