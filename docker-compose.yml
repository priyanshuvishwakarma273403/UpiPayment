version: '3.8'

networks:
  upimesh-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mongo_data:

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: upimesh-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-upimesh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-upimesh_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-upimesh}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - upimesh-network

  redis:
    image: redis:7-alpine
    container_name: upimesh-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - upimesh-network

  mongodb:
    image: mongo:6.0
    container_name: upimesh-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - upimesh-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: upimesh-zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - upimesh-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: upimesh-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - upimesh-network

  # ==========================================
  # Service Discovery & Gateway
  # ==========================================
  eureka-server:
    build:
      context: ./Eureka/Eureka
    container_name: upimesh-eureka
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    environment:
      EUREKA_SERVER_USER: ${EUREKA_SERVER_USER:-admin}
      EUREKA_SERVER_PASSWORD: ${EUREKA_SERVER_PASSWORD:-admin123}
    networks:
      - upimesh-network

  api-gateway:
    build:
      context: ./Gateway/Gateway
    container_name: upimesh-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://admin:admin123@eureka-server:8761/eureka/}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-c2VudGluZWx4X3VwaV9tZXNoX3NlY3VyZV9qd3Rfc2VjcmV0X2tleV8yMDI2}
    networks:
      - upimesh-network

  # ==========================================
  # Domain Microservices (24 Services)
  # ==========================================
  auth:
    build:
      context: ./Auth/Auth
    container_name: upimesh-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://admin:admin123@eureka-server:8761/eureka/}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/upi_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-upimesh}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-upimesh_secret}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-c2VudGluZWx4X3VwaV9tZXNoX3NlY3VyZV9qd3Rfc2VjcmV0X2tleV8yMDI2}
